name: Continuous Integration

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build Lean Project
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read Palomar preflight pin
        id: preflight_pin
        run: echo "sha=$(tr -d '[:space:]' < vendor/PALOMAR_PREFLIGHT_PIN)" >> "$GITHUB_OUTPUT"

      - name: Checkout palomar-preflight
        uses: actions/checkout@v4
        with:
          repository: catskillsresearch/palomar-preflight
          ref: ${{ steps.preflight_pin.outputs.sha }}
          path: palomar-preflight

      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Configure Lake cache
        run: lake exe cache get || true

      - name: Run mechanical Palomar preflight
        run: bash scripts/palomar_preflight.sh --mechanical-only
