# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Interpreting Lambda Calculus in Domain-Valued Random Variables (CSL 2026)"
  description: >-
    A Lean 4 / mathlib formalization of Furber, Mardare, Panangaden, and Scott's
    2026 paper *Interpreting Lambda Calculus in Domain-Valued Random Variables*
    (LIPIcs, Vol. 363, CSL 2026, Article 48). The paper develops Boolean-valued
    domain theory from scratch and shows how the lambda-calculus can be interpreted
    using domain-valued random variables, focusing on the reflexive domain
    construction. Lean is written by AI agents under the direction and review of
    the author. The paper's authors did not participate in or endorse this
    formalization. There is no sorry outside the deliberate holes in Challenge.lean,
    no project-defined axiom. Mathlib is the only Lake require. The sibling
    formalization scott1972 is vendored in vendor/scott1972 and compiled as
    this package's Scott1972 library (srcDir; see vendor/FROZEN.txt).
  authors:
    - "Lars Warren Ericson"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Lars Warren Ericson"

repository:
  role: substantive-development

classification:
  arxiv: [cs.LO, cs.PL]
  msc2020: ["68Q55", "06D99", "03B70"]

status:
  scope: >-
    Sorry-free formalization of the CSL 2026 paper development in Scott2026/,
    including corollary_34, lemma_35_of, proposition_36_of, theorem26Full /
    theorem_26, theorem_30_va / theorem_30, proposition_42_algebra,
    theorem_43_paper, and proposition_44_coin. The Palomar Challenge surface
    compares three Mathlib-only Proposition 27 wrappers
    (proposition_27_finite_directed, proposition_27_finite_sUnion,
    proposition_27_finite_countable). Headline theorems whose types mention
    project definitions are proved in the library and are not Comparator-locked.
  sorry_count: 3
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results:
    - declaration: "Scott2026.proposition_27_finite_directed"
      file: "Scott2026/Basic.lean"
      note: "Proposition 27 directed finite-subset clause; Mathlib-only Comparator target."
    - declaration: "Scott2026.proposition_27_finite_sUnion"
      file: "Scott2026/Basic.lean"
      note: "Proposition 27 join-of-finite-subsets clause; Mathlib-only Comparator target."
    - declaration: "Scott2026.proposition_27_finite_countable"
      file: "Scott2026/Basic.lean"
      note: "Proposition 27 countable-base clause; Mathlib-only Comparator target."
    - paper: "corollary_34"
      file: "Scott2026/Corollary34.lean"
      note: "Internal reflexive continuous lattice with numerals; not Comparator-locked."
    - paper: "lemma_35_of"
      file: "Scott2026/Lemma35General.lean"
      note: "Domain-general Lemma 35; Engeler lemma_35 remains the special case."
    - paper: "proposition_36_of"
      file: "Scott2026/Prop36.lean"
      note: "Domain-general Proposition 36; Engeler proposition_36 remains the special case."
    - paper: "theorem26Full"
      file: "Scott2026/Theorem26.lean"
      note: "Internal SetoidF_A Theorem 26; Engeler theorem_26 remains the weaker packaging."
    - paper: "theorem_30_va"
      file: "Scott2026/Theorem30Internal.lean"
      note: "Internal Definition 19 form of Theorem 30; theorem_30 remains the carrier packaging."
    - paper: "proposition_42_algebra"
      file: "Scott2026/Coin.lean"
      note: "Boolean-value-0 statement in coinAlgebra; finite-K is a Finset join."
    - paper: "theorem_43_paper"
      file: "Scott2026/Coin.lean"
      note: "Paper-chain Theorem 43; theorem_43 remains the external-oracle form."
    - paper: "proposition_44_coin"
      file: "Scott2026/Coin.lean"
      note: "Fair-coin instance of Proposition 44; not a continuous dcpo."

fidelity:
  divergences: >-
    Working source: sources/Scott2026.pdf (a vision transcription
    sources/Scott2026_vision.md is produced by scripts/ocr_pdf_pipeline.sh).
    [Nontrivial A] makes the paper’s implicit ⊥ ≠ ⊤ convention explicit.
    proposition_42_algebra finite-K is a Finset join (fuzzy pfinB exists-quantifier
    not fully internalized). theorem_43_paper uses fiberwise Lemma 35(ii) mixed
    in L⁰/G_X_measure, not a direct theorem_1_iii hookup; theorem_43 remains
    the external-oracle form. All-sets NegligibilitySpace.measurableRep /
    ofMeasure hN is stronger than paper Σ/N; paper A(X) is MeasureAlgebra.
    Engeler-only lemma_35 / proposition_36 / proposition_42 / theorem_43 keep
    weaker or special-case names.

sources:
  - title: "Interpreting Lambda Calculus in Domain-Valued Random Variables"
    authors:
      - "Robert Furber"
      - "Radu Mardare"
      - "Prakash Panangaden"
      - "Dana S. Scott"
    type: "inproceedings"
    location: >-
      31st EACSL Annual Conference on Computer Science Logic (CSL 2026),
      LIPIcs, Vol. 363, Article 48.
    relationship: formalizes
    author_endorsement: not-contacted
    note: >-
      Primary source. The paper's authors were not contacted and did not
      participate in or endorse this formalization. Working PDF:
      sources/Scott2026.pdf. Related full version: arXiv:2112.06339.

  - title: "Continuous Lattices"
    authors:
      - "Dana S. Scott"
    type: "incollection"
    id: "https://github.com/catskillsresearch/scott1972"
    location: "Lecture Notes in Mathematics 274 (1972), §§2–4"
    relationship: background
    author_endorsement: not-contacted
    note: >-
      Background domain theory (way-below, Scott topology, continuous lattices).
      Imported via the vendored sibling Lean formalization in vendor/scott1972.

related_formalizations:
  - id: "https://github.com/catskillsresearch/scott1982"
    relationship: other
    note: "Same-author formalization of Scott Domains for Denotational Semantics (1982); not imported here."

  - id: "https://github.com/catskillsresearch/scott1976"
    relationship: other
    note: "Same-author formalization of Scott Data Types as Lattices (1976); not imported here."

  - id: "https://github.com/catskillsresearch/scott1972/tree/a198b6e24aea07cfc858a59798d0ca78161c4387"
    relationship: builds-on
    note: >-
      Same-author per-paper home for Scott 1972 continuous lattices.
      vendor/scott1972 is a copy of revision
      a198b6e24aea07cfc858a59798d0ca78161c4387 (ledger vendor/FROZEN.txt).
      Compiled as this package's lean_lib (srcDir), not as a Lake path/git
      dep, so Palomar landrun can write only under .lake/. Local
      modifications: the sibling Palomar kit is omitted (Challenge.lean,
      Solution.lean, comparator.json, formalization.yaml, preflight
      scripts, docs, PROVENANCE.md); lakefile.toml and CI default to the
      Scott1972 library only. No Lean sources were edited.

automation:
  methods:
    - method: agent
      models: ["Cursor Grok 4.6 High Fast (SpaceXAI / Cursor)"]
      framework: "Cursor"
      role: >-
        Primary agent for Lean 4 / mathlib formalization, lake build repair,
        vision-OCR transcription, and arxiv.md drafting.
    - method: agent
      models: ["Cursor Composer 2.5 Fast"]
      framework: "Cursor"
      role: "Routine scaffolding and medium-complexity proof obligations."
    - method: agent
      models: ["Anthropic Claude Sonnet 5 (medium reasoning)"]
      framework: "Cursor"
      role: "Day-to-day formalization and proof-engineering."
    - method: agent
      models: ["Anthropic Claude Opus 4.8 (high reasoning)"]
      framework: "Cursor"
      role: "Heaviest proof work."
    - method: manual
      models: []
      role: >-
        The author chose the formalization route, reviewed every definition
        and claim, and takes sole responsibility for the mathematical content.
        The paper's authors were not consulted.
  notes: >-
    Palomar Challenge / Solution / comparator / formalization.yaml packaging
    follows the scott1964 / scott1982 template.

review:
  status: self-assessed
  reviewers:
    - "Lars Warren Ericson"
  notes: >-
    The author directed and reviewed the development. No external review of
    the Lean source, and no review or endorsement by the paper's authors. Every
    proof step is checked by the Lean kernel.

known_gaps:
  - >-
    The Palomar Challenge surface is a Mathlib-only headline subset
    (Proposition 27 finite-subset wrappers). Full paper proofs live in
    Scott2026/ and are re-exported by Solution.lean; their types mention
    project definitions and are not Comparator-locked.
  - >-
    proposition_42_algebra finite-K is a Finset join; the paper’s fuzzy
    pfinB exists-quantifier over P_fin^A(check ω) is not fully internalized
    (no proposition_42_va).
  - >-
    theorem_43_paper uses fiberwise Lemma 35(ii) mixed in L⁰ / G_X_measure
    rather than a direct theorem_1_iii hookup; theorem_43 remains the
    external-oracle form of the same conclusion type.
  - >-
    All-sets NegligibilitySpace.measurableRep / ofMeasure hN is stronger than
    paper Σ/N; coin space does not inhabit that all-sets instance. Paper
    A(X) is MeasureAlgebra.
  - >-
    Engeler-only lemma_35 / proposition_36 / proposition_42 / theorem_43
    keep weaker or special-case names beside the paper-type theorems.

limitations:
  - >-
    No external mathematical review has been performed.
  - >-
    Challenge.lean may contain deliberate sorries; Solution.lean and
    Scott2026/* must not.
  - >-
    Challenge/Solution type comparison covers only the Mathlib-expressible
    Proposition 27 wrappers, not the full paper-type inventory.

alignment:
  namespace: "Scott2026"
  statements:
    - source: "Proposition 27, directed finite subsets of 𝒫(X)"
      lean: "proposition_27_finite_directed"
      module: "Scott2026.Basic"
      status: proved
      note: "Mathlib-only Comparator target."
    - source: "Proposition 27, union of finite subsets of 𝒫(X)"
      lean: "proposition_27_finite_sUnion"
      module: "Scott2026.Basic"
      status: proved
      note: "Mathlib-only Comparator target."
    - source: "Proposition 27, countable family of finite subsets"
      lean: "proposition_27_finite_countable"
      module: "Scott2026.Basic"
      status: proved
      note: "Mathlib-only Comparator target."
