# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Interpreting Lambda Calculus in Domain-Valued Random Variables (CSL 2026)"
  description: >-
    Sorry-free Lean 4 / mathlib formalization of Furber, Mardare, Panangaden,
    and Scott, Interpreting Lambda Calculus in Domain-Valued Random Variables
    (LIPIcs, Vol. 363, CSL 2026, Article 48). The development reconstructs the
    Boolean-valued universe V^A, the internal Engeler model, and the
    interpretation of λ-calculus in domain-valued random variables, covering
    every numbered paper item from Theorem 1 through Proposition 44. Headlines
    include Theorems 26 and 30, Corollary 34, the Lemma 35 / Proposition 36
    oracle calculus, the measure algebra A(X)=Σ/N, Propositions 39–42,
    Theorem 43 (incomparable λ-degrees of two fair-coin subsets of ℕ), and
    Proposition 44 (L⁰ is not a continuous dcpo when A(X) is non-atomic).
    Domain-theory background is imported from a vendored copy of scott1972.
    The Palomar Challenge locks three Mathlib-only Proposition 27 wrappers;
    the remaining numbered statements are kernel-checked in Scott2026/ and
    re-exported by Solution.lean. Lean is written by AI agents under the
    direction and review of the author. The paper's authors were not contacted
    and did not participate in or endorse this formalization. There is no
    sorry outside the deliberate holes in Challenge.lean, no project-defined
    axiom, and Mathlib is the only Lake require.
  authors:
    - "Lars Warren Ericson"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Lars Warren Ericson"

repository:
  role: substantive-development

classification:
  arxiv: [cs.LO, cs.PL]
  msc2020: ["68Q55", "06D99", "03B70"]

